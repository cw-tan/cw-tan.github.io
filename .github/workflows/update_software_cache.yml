name: Update software cache

on:
  schedule:
    - cron: "0 5 * * *" # midnight EST (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Fetch GitHub data
        run: python scripts/update_software_cache.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # format the generated file with the same prettier as the check workflow,
      # so the repo-wide `prettier . --check` stays green after the bot commits
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4

      - name: Format with Prettier 🎨
        run: |
          npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid
          npx prettier --write _data/software.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/software.yml
          git diff --cached --quiet || git commit -m "chore: update software cache"
          git push
